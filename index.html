<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal Editor</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #16181c;
            --panel: #1d2025;
            --line: #2c3037;
            --text: #c8ccd4;
            --dim: #8a909a;
            --accent: #ffb43c;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font: 13px system-ui, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }
        #toolbar .group {
            display: flex;
            gap: 4px;
            padding-right: 8px;
            margin-right: 2px;
            border-right: 1px solid var(--line);
        }
        #toolbar .group:last-of-type {
            border-right: none;
        }
        #toolbar button {
            font: inherit;
            color: var(--text);
            background: #262a31;
            border: 1px solid #343944;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }
        #toolbar button:hover:not(:disabled) {
            background: #2e333b;
        }
        #toolbar button.on {
            color: #1a1a1a;
            background: var(--accent);
            border-color: var(--accent);
        }
        #toolbar button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        #toolbar kbd {
            font: 11px ui-monospace, monospace;
            color: var(--dim);
            margin-left: 4px;
        }
        #toolbar button.on kbd {
            color: #3a3020;
        }
        #file {
            margin-left: auto;
            color: var(--dim);
        }
        #main {
            flex: 1;
            display: flex;
            min-height: 0;
        }
        #planbox {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        #plan {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #panel {
            width: 290px;
            flex: none;
            overflow-y: auto;
            padding: 4px 12px 12px;
            background: var(--panel);
            border-left: 1px solid var(--line);
        }
        #panel .none {
            color: var(--dim);
            margin: 14px 0;
        }
        #panel section {
            padding: 4px 0 8px;
            border-bottom: 1px solid var(--line);
        }
        #panel h2 {
            font-size: 12px;
            font-weight: 600;
            color: var(--dim);
            margin: 10px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        #panel .row {
            display: grid;
            grid-template-columns: 56px 1fr;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }
        #panel .row[hidden] {
            display: none;
        }
        #panel .controls {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        #panel .value {
            color: var(--text);
        }
        #panel input.number {
            width: 56px;
            font: 13px ui-monospace, monospace;
            color: var(--text);
            background: #262a31;
            border: 1px solid #343944;
            border-radius: 4px;
            padding: 3px 6px;
            text-align: right;
        }
        #panel input.number:focus {
            outline: none;
            border-color: var(--accent);
        }
        #panel input.number:read-only {
            color: var(--dim);
            background: transparent;
            border-color: transparent;
        }
        #panel input[type=checkbox] {
            margin: 0;
            accent-color: var(--accent);
        }
        #panel button, .shade-picker button {
            font: inherit;
            color: var(--text);
            background-color: #262a31;
            border: 1px solid #343944;
            border-radius: 4px;
            cursor: pointer;
        }
        #panel button:hover:not(:disabled) {
            background-color: #2e333b;
        }
        #panel button.step {
            width: 24px;
            padding: 3px 0;
        }
        #panel button.shade {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 6px;
            padding: 2px 8px 2px 3px;
            font: 12px ui-monospace, monospace;
        }
        .swatch {
            display: inline-block;
            width: 28px;
            height: 18px;
            border-radius: 2px;
            background-size: 16px 4px;
            image-rendering: pixelated;
        }
        .swatch.mixed {
            background: repeating-linear-gradient(45deg, #3a3f48 0 4px, #262a31 4px 8px);
        }
        .shade-picker {
            position: fixed;
            z-index: 10;
            padding: 8px;
            background: var(--panel);
            border: 1px solid #3a3f48;
            border-radius: 6px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
        .shade-picker .grid {
            display: grid;
            grid-template-columns: repeat(7, 30px);
            gap: 4px;
        }
        .shade-picker button.swatch {
            width: 30px;
            height: 20px;
            padding: 0;
            border: 1px solid transparent;
        }
        .shade-picker button.swatch:hover {
            border-color: #ffffff;
        }
        .shade-picker button.swatch.current {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .shade-picker .label {
            margin-top: 6px;
            font: 12px ui-monospace, monospace;
            color: var(--dim);
            white-space: pre;
        }
        #status {
            padding: 5px 10px;
            border-top: 1px solid var(--line);
            background: var(--panel);
            white-space: pre;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #help {
            padding: 0 10px 5px;
            background: var(--panel);
            color: var(--dim);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div class="group">
            <button id="place" title="Placement mode: click to add a vertex, drag to draw an edge">Place<kbd>P</kbd></button>
            <button id="select" title="Selection mode: click to select, drag to move or box-select">Select<kbd>S</kbd></button>
        </div>
        <div class="group">
            <button id="grid" title="Snap to the grid (G); [ and ] change its size">Grid</button>
        </div>
        <div class="group">
            <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
            <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
            <button id="fit" title="Show the whole map (F)">Fit<kbd>F</kbd></button>
        </div>
        <div class="group">
            <button id="new" title="Start a new map">New</button>
            <button id="open" title="Open a map (Ctrl+O)">Open</button>
            <button id="save" title="Save the map (Ctrl+S)">Save</button>
        </div>
        <span id="file"></span>
        <input id="picker" type="file" accept=".pmap,text/plain" hidden>
    </div>
    <div id="main">
        <div id="planbox"><canvas id="plan"></canvas></div>
        <aside id="panel"></aside>
    </div>
    <div id="status"></div>
    <div id="help">Shift: select, adding  |  Esc: clear selection  |  Del: delete edges, then vertices  |  arrows: nudge  |  wheel: zoom  |  right-drag: pan</div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
